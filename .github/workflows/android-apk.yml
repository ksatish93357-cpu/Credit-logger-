name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Debug & Optional Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm install

      - name: Ensure Capacitor 6 Android packages are installed
        run: |
          if ! node -e "require.resolve('@capacitor/core'); require.resolve('@capacitor/cli'); require.resolve('@capacitor/android');" 2>/dev/null; then
            npm install --no-save @capacitor/core@^6.2.3 @capacitor/cli@^6.2.3 @capacitor/android@^6.2.3
          fi

      - name: Build Vite production bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: |
          RESTORE_TS_CONFIG=0
          cleanup() {
            if [ "$RESTORE_TS_CONFIG" -eq 1 ] && [ -f "capacitor.config.ts.bak" ]; then
              rm -f capacitor.config.json
              mv capacitor.config.ts.bak capacitor.config.ts
            fi
          }
          trap cleanup EXIT

          # Capacitor 6 CLI uses ts.transpileModule, which is unavailable in TypeScript 7.x.
          # Temporarily export capacitor.config.ts to capacitor.config.json during Capacitor CLI sync.
          if [ -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx tsx -e "import cfg from './capacitor.config.ts'; import fs from 'node:fs'; fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2) + '\n');"
            mv capacitor.config.ts capacitor.config.ts.bak
            RESTORE_TS_CONFIG=1
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Debug APK output
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: credit-logger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check Android release signing secrets
        id: check_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "All Android release signing secrets found. Release APK build enabled."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured. Skipping optional Release APK build."
          fi

      - name: Decode release keystore
        if: steps.check_signing.outputs.has_signing == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "${{ runner.temp }}/credit-logger-release.jks"
          test -s "${{ runner.temp }}/credit-logger-release.jks"

      - name: Build Signed Release APK with Gradle
        if: steps.check_signing.outputs.has_signing == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${{ runner.temp }}/credit-logger-release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/credit-logger-release.jks"

      - name: Upload Signed Release APK artifact
        if: steps.check_signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: credit-logger-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
